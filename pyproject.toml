[project]
name = "aak-f2"
version = "0.1.0"
description = "A Python client for the F2 ESDH system."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "GHBM-ITK", email = "ghbm@aarhus.dk" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["f2", "esdh", "cbrain", "aarhus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aak-rpa/aak-f2-python"
Repository = "https://github.com/aak-rpa/aak-f2-python"
Issues = "https://github.com/aak-rpa/aak-f2-python/issues"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle (flake8 core)
    "F",       # pyflakes (flake8 core)
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax
    "PL",      # pylint rules
]
